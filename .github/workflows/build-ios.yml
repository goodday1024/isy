name: build-ios-ipa

# isy iOS App 构建 workflow
# 触发: push 到 main / 手动 dispatch / 创建 release
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Project.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------- 阶段 1: 跨平台核心库测试 (Linux) ----------
  test-core:
    name: Test isyCore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test --parallel
      - name: Verify CLI
        run: |
          .build/release/isycli info
          .build/release/isycli bench
          .build/release/isycli syscall 172
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .build/

  # ---------- 阶段 2: iOS App 构建 (macOS) ----------
  build-ios:
    name: Build iOS ipa (macOS)
    runs-on: macos-14
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode & list SDKs
        run: |
          # 选取最新可用 Xcode
          ls /Applications | grep -i xcode
          DEFAULT_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $DEFAULT_XCODE"
          sudo xcode-select -s "$DEFAULT_XCODE/Contents/Developer"
          xcodebuild -version
          echo "--- Available iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Download ARM64 busybox
        run: |
          mkdir -p Sources/isyApp/Resources
          echo "下载 ARM64 静态 busybox..."
          curl -fL --retry 3 \
            https://busybox.net/downloads/binaries/1.36.1-defconfig-multiarch-musl/busybox-aarch64 \
            -o Sources/isyApp/Resources/busybox
          chmod +x Sources/isyApp/Resources/busybox
          echo "busybox 大小: $(stat -f%z Sources/isyApp/Resources/busybox) bytes"
          # 验证 ELF magic + aarch64
          file Sources/isyApp/Resources/busybox || true
          # ELF header 检查: 0x7F 'E' 'L' 'F' + machine=0xB7 (183=aarch64)
          head -c 20 Sources/isyApp/Resources/busybox | xxd | head -2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve iOS SDK
        id: sdk
        run: |
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9.]+' | sort -V | tail -1)
          echo "Resolved SDK: $SDK"
          echo "sdk=$SDK" >> $GITHUB_OUTPUT

      - name: Build archive (unsigned)
        run: |
          mkdir -p build
          # 用 -sdk 替代 -destination, 避免 "iOS X.X is not installed" 平台缺失问题
          xcodebuild archive \
            -project isy.xcodeproj \
            -scheme isyApp \
            -configuration Release \
            -sdk ${{ steps.sdk.outputs.sdk }} \
            -archivePath build/isy.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Export unsigned ipa
        run: |
          mkdir -p build/export
          cat > build/export/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string></string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/isy.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || true
          # 如果 export 失败 (无签名), 用 zip 手动打 ipa
          if [ ! -f build/export/isy.ipa ]; then
            echo "exportArchive 失败 (无签名证书), 改用 zip 打包 Payload"
            cd build
            mkdir -p Payload
            cp -r isy.xcarchive/Products/Applications/isy.app Payload/
            zip -qry isy-unsigned.ipa Payload
            cd ..
            mv build/isy-unsigned.ipa build/export/isy-unsigned.ipa
          fi
          ls -la build/export/

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: isy-ios-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isy-xcarchive
          path: build/isy.xcarchive
          retention-days: 7

  # ---------- 阶段 3: Release (仅在 tag 时) ----------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-ios
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download ipa
        uses: actions/download-artifact@v4
        with:
          name: isy-ios-ipa
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipa
          generate_release_notes: true
          draft: true
