name: build-ios-ipa

# isy iOS App 构建 workflow
# 触发: push 到 main / 手动 dispatch / 创建 release
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Project.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------- 阶段 1: 跨平台核心库测试 (Linux) ----------
  test-core:
    name: Test isyCore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test --parallel
      - name: Verify CLI
        run: |
          .build/release/isycli info
          .build/release/isycli bench
          .build/release/isycli syscall 172
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .build/

  # ---------- 阶段 2: iOS App 构建 (macOS) ----------
  build-ios:
    name: Build iOS ipa (macOS)
    runs-on: macos-14
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode & list SDKs
        run: |
          # 选取最新可用 Xcode
          ls /Applications | grep -i xcode
          DEFAULT_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $DEFAULT_XCODE"
          sudo xcode-select -s "$DEFAULT_XCODE/Contents/Developer"
          xcodebuild -version
          echo "--- Available iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Download ARM64 busybox
        run: |
          mkdir -p Sources/isyApp/Resources
          echo "下载 ARM64 静态 busybox (Alpine busybox-static)..."
          # 从 Alpine 官方 CDN 下载 busybox-static APK (aarch64, static-pie linked)
          curl -fL --retry 3 \
            https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64/busybox-static-1.37.0-r31.apk \
            -o /tmp/busybox-static.apk
          # APK 是 gzip tar, 从中提取 bin/busybox.static
          mkdir -p /tmp/bb-extract
          tar -xzf /tmp/busybox-static.apk -C /tmp/bb-extract 2>/dev/null || true
          cp /tmp/bb-extract/bin/busybox.static Sources/isyApp/Resources/busybox
          chmod +x Sources/isyApp/Resources/busybox
          echo "busybox 大小: $(stat -f%z Sources/isyApp/Resources/busybox) bytes"
          # 验证: ELF magic + aarch64 + static linked
          file Sources/isyApp/Resources/busybox || true
          # ELF header 校验: 0x7F 'E' 'L' 'F' + machine=0xB7 (183=aarch64)
          head -c 20 Sources/isyApp/Resources/busybox | od -A x -t x1z | head -2
          # 严格校验 ELF magic 和 aarch64 机器类型
          if [ "$(head -c 4 Sources/isyApp/Resources/busybox)" != $'\x7fELF' ]; then
            echo "错误: 不是有效的 ELF 文件"; exit 1
          fi
          machine=$(od -A n -t x1 -j 18 -N 1 Sources/isyApp/Resources/busybox | tr -d ' ')
          if [ "$machine" != "b7" ]; then
            echo "错误: 不是 aarch64 (machine=0x$b7 实际=0x$machine)"; exit 1
          fi
          echo "✓ ARM64 静态 busybox 校验通过"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve iOS SDK
        id: sdk
        run: |
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9.]+' | sort -V | tail -1)
          echo "Resolved SDK: $SDK"
          echo "sdk=$SDK" >> $GITHUB_OUTPUT

      - name: Setup code signing
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "mode=adhoc" >> $GITHUB_OUTPUT
            echo "未配置开发者证书, 使用 ad-hoc 签名 (entitlements 不会生效)"
            exit 0
          fi

          echo "mode=developer" >> $GITHUB_OUTPUT
          echo "检测到开发者证书, 使用开发者签名 (entitlements 会生效)"

          # 创建临时 keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 导入证书
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          # 安装 provisioning profile
          echo $BUILD_PROVISION_PROFILE_BASE64 | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          # 从 provisioning profile 提取信息
          security cms -D -i $RUNNER_TEMP/profile.mobileprovision > $RUNNER_TEMP/profile.plist
          PP_UUID=$(plutil -extract UUID raw $RUNNER_TEMP/profile.plist)
          APP_ID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/profile.plist)
          TEAM_ID="${APP_ID%%.*}"
          BUNDLE_ID="${APP_ID#*.}"
          # 通配符 profile 时保留原 bundle ID
          if [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID="app.isy.ios"
          fi

          echo "profile_uuid=$PP_UUID" >> $GITHUB_OUTPUT
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_OUTPUT
          echo "Provisioning Profile UUID: $PP_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

          # 判断证书/profile 类型 + 导出方法
          # 三种组合:
          #   - get-task-allow=true                         -> Development  (development)
          #   - get-task-allow=false + ProvisionedDevices   -> Distribution (ad-hoc)
          #   - get-task-allow=false + ProvisionsAllDevices -> Distribution (enterprise)
          #   - get-task-allow=false + 都没有               -> Distribution (app-store)
          CERT_IDENTITY="iPhone Distribution"
          EXPORT_METHOD="app-store"
          if plutil -extract Entitlements.get-task-allow raw $RUNNER_TEMP/profile.plist 2>/dev/null | grep -q "1"; then
            CERT_IDENTITY="iPhone Developer"
            EXPORT_METHOD="development"
          elif plutil -extract ProvisionsAllDevices raw $RUNNER_TEMP/profile.plist 2>/dev/null | grep -q "1"; then
            EXPORT_METHOD="enterprise"
          elif [ "$(plutil -extract ProvisionedDevices raw $RUNNER_TEMP/profile.plist 2>/dev/null | head -c1)" != "" ]; then
            # 存在设备列表 -> ad-hoc 分发
            EXPORT_METHOD="ad-hoc"
          fi
          echo "证书类型: $CERT_IDENTITY"
          echo "导出方法: $EXPORT_METHOD"
          echo "cert_identity=$CERT_IDENTITY" >> $GITHUB_OUTPUT
          echo "export_method=$EXPORT_METHOD" >> $GITHUB_OUTPUT

      - name: Build archive
        run: |
          mkdir -p build
          SIGN_MODE="${{ steps.signing.outputs.mode }}"

          if [ "$SIGN_MODE" = "developer" ]; then
            echo "=== 使用开发者证书签名 (${{ steps.signing.outputs.cert_identity }}) ==="
            # 注意: PROVISIONING_PROFILE_SPECIFIER 等参数只对 app target 生效,
            # SPM 模块 (isyCore/isyUI/isyCHot) 不需要签名, 但 xcodebuild 会继承
            # 这些参数导致冲突. 通过 Project.yml 已为 SPM 包设置 CODE_SIGNING_ALLOWED=NO.
            xcodebuild archive \
              -project isy.xcodeproj \
              -scheme isyApp \
              -configuration Release \
              -sdk ${{ steps.sdk.outputs.sdk }} \
              -archivePath build/isy.xcarchive \
              CODE_SIGN_IDENTITY="${{ steps.signing.outputs.cert_identity }}" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_ENTITLEMENTS=Sources/isyApp/isy.entitlements \
              DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
              PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_uuid }}" \
              PRODUCT_BUNDLE_IDENTIFIER="${{ steps.signing.outputs.bundle_id }}" \
              ARCHS=arm64
          else
            echo "=== 使用 ad-hoc 签名 (无证书回退) ==="
            xcodebuild archive \
              -project isy.xcodeproj \
              -scheme isyApp \
              -configuration Release \
              -sdk ${{ steps.sdk.outputs.sdk }} \
              -archivePath build/isy.xcarchive \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_ENTITLEMENTS=Sources/isyApp/isy.entitlements \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              ARCHS=arm64
          fi

      - name: Re-sign with full entitlements (ad-hoc fallback only)
        if: steps.signing.outputs.mode != 'developer'
        run: |
          # 仅在 ad-hoc 模式下重签 (开发者模式已正确签名)
          APP_PATH="build/isy.xcarchive/Products/Applications/isy.app"
          echo "=== 重签前的 entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 || true
          echo "=== 手动重签 (ad-hoc + 完整 entitlements) ==="
          codesign --force --sign - --entitlements Sources/isyApp/isy.entitlements "$APP_PATH"
          echo "=== 重签后的 entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 || true

      - name: Export IPA
        run: |
          mkdir -p build/export
          SIGN_MODE="${{ steps.signing.outputs.mode }}"
          APP_PATH="build/isy.xcarchive/Products/Applications/isy.app"

          echo "=== 验证 entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 || true
          echo "=== 验证签名 ==="
          codesign -dv "$APP_PATH" 2>&1 || true

          if [ "$SIGN_MODE" = "developer" ]; then
            echo "=== 使用开发者证书导出 IPA (${{ steps.signing.outputs.export_method }}) ==="
            cat > build/export/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ steps.signing.outputs.export_method }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${{ steps.signing.outputs.team_id }}</string>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ steps.signing.outputs.bundle_id }}</key>
                  <string>${{ steps.signing.outputs.profile_uuid }}</string>
              </dict>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive \
              -archivePath build/isy.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist build/export/ExportOptions.plist || true
          fi

          # 如果 export 失败或 ad-hoc 模式, 用 zip 打包
          if [ ! -f build/export/isy.ipa ]; then
            echo "exportArchive 未生成 IPA, 改用 zip 打包"
            cd build
            mkdir -p Payload
            cp -r isy.xcarchive/Products/Applications/isy.app Payload/
            zip -qry isy.ipa Payload
            cd ..
            mv build/isy.ipa build/export/isy.ipa
          fi
          ls -la build/export/
          echo "=== 最终 IPA 内的 entitlements ==="
          unzip -p build/export/isy.ipa Payload/isy.app/isy > /tmp/isy_bin
          codesign -d --entitlements - /tmp/isy_bin 2>&1 || true

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: isy-ios-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isy-xcarchive
          path: build/isy.xcarchive
          retention-days: 7

  # ---------- 阶段 3: Release (仅在 tag 时) ----------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-ios
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download ipa
        uses: actions/download-artifact@v4
        with:
          name: isy-ios-ipa
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipa
          generate_release_notes: true
          draft: true
