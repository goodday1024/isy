name: isy
options:
  bundleIdPrefix: app.isy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "-ObjC"
    ENABLE_JIT: NO

targets:
  isyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/isyApp
    dependencies:
      - package: isy
        product: isyCore
      - package: isy
        product: isyUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isy.ios
        PRODUCT_NAME: isy
        INFOPLIST_FILE: Sources/isyApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

packages:
  isy:
    path: .

schemes:
  isyApp:
    build:
      targets:
        isyApp: all
    run:
      config: Debug
    archive:
      config: Release
