# isy - iOS System
# Xcode 工程生成配置 (用 xcodegen 生成 .xcodeproj)
#
# 生成方式: xcodegen generate
# 这会基于本文件 + Package.swift 生成 isy.xcodeproj

name: isy
options:
  bundleIdPrefix: app.isy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OBJC_BRIDGING_HEADER: ""
    OTHER_LDFLAGS: "-ObjC"
    # 允许 isyCore 的 C target (isyCHot) 链接
    SWIFT_PACKAGE_MANAGER_BUILDS: YES

packages:
  isy:
    path: .

targets:
  isyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/isyApp
      - path: Resources
        type: folder
        optional: true
    dependencies:
      - package: isy
        product: isyCore
      - package: isy
        product: isyCHot
      - package: isy
        product: isyUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isy.ios
        PRODUCT_NAME: isy
        INFOPLIST_FILE: Sources/isyApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 签名: CI 上用 ad-hoc 自签名 (iPhone Distribution 不可用)
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        # 启用 W^X 合规: 不能开 JIT
        ENABLE_JIT: NO
        # 资源: rootfs 归档 (后续打包)
        # COPY_PHASE_STRIP: NO

schemes:
  isyApp:
    build:
      targets:
        isyApp: all
    run:
      config: Debug
    archive:
      config: Release
